name: Calidad

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_real:
        description: 'Ejecutar además cuentas reales de staging (requiere secretos)'
        type: boolean
        default: false

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ritmo_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: ritmo_ci
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f scripts/ci-bootstrap.sql
      - name: Aplicar todas las migraciones sobre una base vacía
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Aislamiento entre cuentas y cuota de IA
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci-rls.sql
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-key' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Presupuesto de JavaScript móvil
        run: npm run check:bundle
      - name: Alcance de las pruebas
        run: echo 'Pruebas automáticas con datos sintéticos. OAuth, correo y cuentas reales requieren la ejecución manual de staging.' >> "$GITHUB_STEP_SUMMARY"

  ui-local:
    runs-on: ubuntu-latest
    needs: quality
    env:
      RITMO_E2E_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Auditoría visual, responsive y funcional
        run: npm run test:e2e:local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-local-failures
          path: test-results/
          retention-days: 7
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e_real
    runs-on: ubuntu-latest
    needs: [quality, database]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
      E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
      E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-e2e-env.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: E2E autenticadas
        run: npm run test:e2e -- --project=chromium
      - name: E2E móvil pública
        run: npm run test:e2e -- --project=mobile-chrome --project=mobile-webkit --grep="registro móvil"
