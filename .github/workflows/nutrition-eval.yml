name: Evaluación nutricional local (sin API)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nutrition-evaluation
  cancel-in-progress: false
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:nutrition:local
