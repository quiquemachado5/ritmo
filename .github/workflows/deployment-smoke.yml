name: Despliegue real

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    env:
      RITMO_DEPLOYMENT_URL: ${{ vars.RITMO_PRODUCTION_URL || 'https://ritmo-nu-six.vercel.app' }}
      RITMO_EXPECTED_BUILD: ${{ github.event.deployment.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Comprobar aplicación y versión de datos
        run: node scripts/smoke-deployment.mjs
